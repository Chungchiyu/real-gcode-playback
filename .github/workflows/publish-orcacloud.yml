# Publishes the plugin to Orca Cloud whenever a GitHub release is published.
# Based on the "Publish from GitHub" section of the Orca Cloud help guide:
#   https://cloud.orcaslicer.com/wiki/#publish-from-github
# No secrets are needed: Orca Cloud trusts a short-lived GitHub OIDC token (audience "orcacloud")
# from a release workflow in the repository connected under Edit plugin > GitHub publishing.
# Orca Cloud only accepts tokens from release runs, so every upload goes through a GitHub release.
#
# To release:
#   1. add the new version at the top of src/changelog.json, run python3 build.py, commit and push
#   2. create a GitHub release with the tag v<that version> on main and publish it
#      (leave the notes empty to use that version's entry from src/changelog.json)
#
# Earlier versions are released the same way, oldest first, one at a time: create a release with
# the tag v<old version> on main. The workflow looks through the history for the commit whose
# dist/orca_playback.py has that version and uploads that file with that commit's changelog entry.
name: Publish to Orca Cloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the plugin file for this version
        id: find
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # the latest commit whose dist/orca_playback.py declares this version
          commit=""
          for c in $(git log --format=%H -- dist/orca_playback.py); do
            v="$(git show "$c:dist/orca_playback.py" | sed -n 's/^# version = "\(.*\)"$/\1/p' | head -n1)"
            if [ "$v" = "$version" ]; then commit="$c"; break; fi
          done
          if [ -z "$commit" ]; then
            echo "::error::No commit has version $version in dist/orca_playback.py. Add it to src/changelog.json, run python3 build.py and commit first."
            exit 1
          fi
          echo "Version $version comes from commit $commit"

          # Orca Cloud needs a target-OS suffix on every file name; a single .py plugin runs anywhere.
          mkdir -p release
          git show "$commit:dist/orca_playback.py" > release/real_gcode_playback_any.py
          git show "$commit:src/changelog.json" > release/changelog.json 2>/dev/null || echo '{"entries":[]}' > release/changelog.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Orca Cloud
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          set -euo pipefail

          oidc_token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"

          # Release notes become the Orca Cloud changelog (max 4000 bytes). Empty notes fall back
          # to this version's entry in src/changelog.json.
          notes="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="$(jq -r --arg v "$VERSION" \
              '.entries[] | select(.version == $v) | .changes | map("- " + .) | join("\n")' release/changelog.json)"
          fi
          notes="$(printf '%s' "$notes" | head -c 4000)"

          if [ -n "$notes" ]; then
            metadata="$(jq -cn --arg version "$VERSION" --arg changelog "$notes" '{version: $version, changelog: $changelog}')"
          else
            metadata="$(jq -cn --arg version "$VERSION" '{version: $version}')"
          fi

          # --form-string: with -F, curl would cut the metadata at the first ";" in the changelog.
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            --form-string "metadata=$metadata" \
            -F "files=@release/real_gcode_playback_any.py" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json; echo
          if [ "$status" != "201" ]; then
            echo "::error::Orca Cloud returned HTTP $status (401: repository not connected to exactly one plugin; version errors: the tag must be higher than the published version)."
            exit 1
          fi
          echo "Published real_gcode_playback_any.py as version $VERSION"
