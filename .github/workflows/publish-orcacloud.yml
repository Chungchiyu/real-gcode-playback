# Publishes the plugin to Orca Cloud whenever a GitHub release is published.
# Based on the "Publish from GitHub" section of the Orca Cloud help guide:
#   https://cloud.orcaslicer.com/wiki/#publish-from-github
# No secrets are needed: Orca Cloud trusts a short-lived GitHub OIDC token (audience "orcacloud")
# from the repository connected under Edit plugin > GitHub publishing.
#
# To release:
#   1. add the new version at the top of src/changelog.json and push
#   2. create a GitHub release with the tag v<that version> and publish it
#      (leave the notes empty to use that version's entry from src/changelog.json)
#
# To upload earlier versions too, run this workflow by hand from the Actions tab
# (Publish to Orca Cloud > Run workflow). It finds every version committed to dist/orca_playback.py
# and uploads them oldest first, each with its own changelog entry. Versions Orca Cloud already has
# (or anything not higher than its current version) are skipped.
name: Publish to Orca Cloud

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions to upload, e.g. 1.2.0 1.3.0 (empty = every version)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  # Orca Cloud needs a target-OS suffix on every file name; a single .py plugin runs anywhere.
  PLUGIN_FILES: "release/real_gcode_playback_any.py"

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the plugin
        run: |
          npm ci
          python3 build.py
          mkdir -p release
          cp dist/orca_playback.py release/real_gcode_playback_any.py

      - name: Check the tag matches the plugin version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(jq -r .version src/changelog.json)"
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match the version in src/changelog.json ($plugin_version)."
            exit 1
          fi
          grep -q "^# version = \"$plugin_version\"$" release/real_gcode_playback_any.py

      - name: Publish to Orca Cloud
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=()
          for pattern in $PLUGIN_FILES; do
            for f in $pattern; do files+=("$f"); done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No plugin files matched PLUGIN_FILES ($PLUGIN_FILES)."
            exit 1
          fi

          oidc_token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"

          version="${GITHUB_REF_NAME#v}"

          # Release notes become the Orca Cloud changelog (max 4000 bytes). Empty notes fall back
          # to this version's entry in src/changelog.json.
          notes="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="$(jq -r --arg v "$version" \
              '.entries[] | select(.version == $v) | .changes | map("- " + .) | join("\n")' src/changelog.json)"
          fi
          notes="$(printf '%s' "$notes" | head -c 4000)"

          if [ -n "$notes" ]; then
            metadata="$(jq -cn --arg version "$version" --arg changelog "$notes" '{version: $version, changelog: $changelog}')"
          else
            metadata="$(jq -cn --arg version "$version" '{version: $version}')"
          fi

          form=(-F "metadata=$metadata")
          for f in "${files[@]}"; do form+=(-F "files=@$f"); done

          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${form[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json; echo
          if [ "$status" != "201" ]; then
            echo "::error::Orca Cloud returned HTTP $status (401: repository not connected to exactly one plugin; version errors: the tag must be higher than the published version)."
            exit 1
          fi
          echo "Published ${files[*]} as version $version"

  publish-history:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish each version to Orca Cloud
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail

          # version -> the latest commit whose dist/orca_playback.py has that version
          declare -A commit_of
          order=()
          for c in $(git log --reverse --format=%H -- dist/orca_playback.py); do
            v="$(git show "$c:dist/orca_playback.py" | sed -n 's/^# version = "\(.*\)"$/\1/p' | head -n1)"
            [ -n "$v" ] || continue
            [ -n "${commit_of[$v]:-}" ] || order+=("$v")
            commit_of[$v]="$c"
          done
          if [ -n "${VERSIONS// /}" ]; then
            read -r -a order <<< "$VERSIONS"
          fi
          echo "Versions: ${order[*]}"

          oidc_token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"

          mkdir -p release
          file=release/real_gcode_playback_any.py
          published=0
          for version in "${order[@]}"; do
            c="${commit_of[$version]:-}"
            if [ -z "$c" ]; then
              echo "::error::No commit has version $version in dist/orca_playback.py."
              exit 1
            fi
            git show "$c:dist/orca_playback.py" > "$file"
            notes="$(git show "$c:src/changelog.json" 2>/dev/null | jq -r --arg v "$version" \
              '.entries[] | select(.version == $v) | .changes | map("- " + .) | join("\n")' | head -c 4000 || true)"
            if [ -n "$notes" ]; then
              metadata="$(jq -cn --arg version "$version" --arg changelog "$notes" '{version: $version, changelog: $changelog}')"
            else
              metadata="$(jq -cn --arg version "$version" '{version: $version}')"
            fi
            status="$(curl -sS -o response.json -w '%{http_code}' \
              -H "Authorization: Bearer $oidc_token" \
              -F "metadata=$metadata" -F "files=@$file" \
              https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
            echo "$version (${c:0:7}) -> HTTP $status: $(cat response.json)"
            if [ "$status" = "201" ]; then
              published=$((published + 1))
            elif [ "$status" = "401" ]; then
              claims="$(printf '%s' "$oidc_token" | cut -d. -f2 | tr '_-' '/+' | { base64 -d 2>/dev/null || true; } | jq -c '{event_name, workflow_ref, job_workflow_ref, ref}' 2>/dev/null || true)"
              echo "OIDC claims sent: $claims"
              echo "::error::Orca Cloud rejected the sign-in. The token must come from the release workflow connected under Edit plugin > GitHub publishing (exactly one plugin per repository); if Orca Cloud only trusts runs triggered by a published release, publish this version by creating a GitHub release instead of running by hand."
              exit 1
            else
              echo "::warning::$version was not uploaded (HTTP $status); Orca Cloud may already have this version or a newer one."
            fi
          done
          echo "Uploaded $published version(s)."
